<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Pętla generowania: tekst, model liczy szanse, kandydaci, wybór klocka i od nowa</title>
  <rect width="1100" height="450" rx="18" fill="#0e1f33"/>
  <!-- ring -->
  <circle cx="320" cy="220" r="140" fill="none" stroke="#2c4763" stroke-width="4"/>
  <g fill="#f2a65a">
    <path d="M -10 -8 L 10 0 L -10 8 Z" transform="translate(419 121) rotate(45)"/>
    <path d="M -10 -8 L 10 0 L -10 8 Z" transform="translate(419 319) rotate(135)"/>
    <path d="M -10 -8 L 10 0 L -10 8 Z" transform="translate(221 319) rotate(225)"/>
    <path d="M -10 -8 L 10 0 L -10 8 Z" transform="translate(221 121) rotate(315)"/>
  </g>
  <text x="320" y="214" fill="#eef3f8" font-size="30" font-style="italic" text-anchor="middle" font-family="Georgia, serif">pętla</text>
  <text x="320" y="242" fill="#9fb3c8" font-size="15" text-anchor="middle">jeden obrót = jeden klocek</text>
  <!-- nodes -->
  <g fill="#0e1f33" stroke="#5bc8f5" stroke-width="3">
    <circle cx="320" cy="80" r="16"/>
    <circle cx="460" cy="220" r="16" fill="#f2a65a" stroke="#f2a65a"/>
    <circle cx="320" cy="360" r="16"/>
    <circle cx="180" cy="220" r="16"/>
  </g>
  <g fill="#eef3f8" font-size="19" font-weight="700" letter-spacing="1.5">
    <text x="320" y="36" text-anchor="middle">TEKST</text>
    <text x="488" y="215">MODEL</text>
    <text x="320" y="402" text-anchor="middle">KANDYDACI</text>
    <text x="152" y="215" text-anchor="end">WYBÓR</text>
  </g>
  <g fill="#9fb3c8" font-size="15">
    <text x="320" y="56" text-anchor="middle">to, co już jest</text>
    <text x="488" y="237">liczy szanse</text>
    <text x="320" y="422" text-anchor="middle">lista z procentami</text>
    <text x="152" y="237" text-anchor="end">dopisz i od nowa</text>
  </g>
  <!-- right panel: the example -->
  <line x1="610" y1="40" x2="610" y2="410" stroke="#2c4763" stroke-width="2"/>
  <text x="640" y="70" fill="#5bc8f5" font-size="14" font-weight="700" letter-spacing="2">PRZYKŁAD</text>
  <text x="640" y="112" fill="#9fb3c8" font-size="22">Na wakacje najchętniej jeżdżę nad</text>
  <g font-size="26" font-weight="700" fill="#eef3f8">
    <rect x="640" y="132" width="74" height="44" rx="8" fill="#f2a65a" fill-opacity="0.22" stroke="#f2a65a" stroke-width="2"/>
    <text x="677" y="163" text-anchor="middle">mor</text>
    <rect x="724" y="132" width="52" height="44" rx="8" fill="#5bc8f5" fill-opacity="0.22" stroke="#5bc8f5" stroke-width="2"/>
    <text x="750" y="163" text-anchor="middle">ze</text>
  </g>
  <text x="790" y="162" fill="#9fb3c8" font-size="15">krok 1 → „mor”, krok 2 → „ze”</text>
  <text x="640" y="230" fill="#5bc8f5" font-size="14" font-weight="700" letter-spacing="2">KANDYDACI W KROKU 1</text>
  <g font-size="20" fill="#eef3f8">
    <text x="640" y="268" font-weight="700">mor</text>
    <rect x="700" y="250" width="290" height="24" rx="5" fill="#18304a"/>
    <rect x="700" y="250" width="281" height="24" rx="5" fill="#f2a65a"/>
    <text x="1002" y="268">97,0%</text>
    <text x="640" y="308" font-weight="700">m</text>
    <rect x="700" y="290" width="290" height="24" rx="5" fill="#18304a"/>
    <rect x="700" y="290" width="4" height="24" rx="2" fill="#5bc8f5"/>
    <text x="1002" y="308">1,0%</text>
  </g>
  <text x="640" y="352" fill="#eef3f8" font-size="16">Model bierze „mor”, dopisuje go do tekstu</text>
  <text x="640" y="374" fill="#eef3f8" font-size="16">i liczy wszystko od nowa dla następnego klocka.</text>
  <text x="640" y="410" fill="#9fb3c8" font-size="13" font-family="Consolas, monospace">pomiar 26.10.2026 · Gemma 4 · Ollama · temperatura 0</text>
</svg>
